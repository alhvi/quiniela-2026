<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiniela Mundial 2026 · Bracket para imprimir</title>
<style>
  @page { size: letter landscape; margin: 0.35in; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: Arial, Helvetica, sans-serif;
    color: #111;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  .page { width: 10.3in; margin: 0 auto; }

  /* ── Header ── */
  .header {
    display: flex; justify-content: space-between; align-items: flex-end;
    border-bottom: 2px solid #111; padding-bottom: 4px; margin-bottom: 4px;
  }
  .title { font-size: 16px; font-weight: 800; letter-spacing: .3px; }
  .subtitle { font-size: 9px; color: #555; margin-top: 1px; }
  .name-line { font-size: 11px; font-weight: 600; }
  .name-line .blankline {
    display: inline-block; width: 200px; border-bottom: 1.5px solid #333;
    margin-left: 4px;
  }

  /* ── Round labels ── */
  .round-labels { display: flex; margin-bottom: 2px; }
  .round-labels > div {
    flex: 1; text-align: center; font-size: 8px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .5px; color: #555;
  }
  .round-labels > div.final-lbl { flex: 1.3; color: #b8860b; }

  /* ── Bracket ── */
  .bracket {
    position: relative; display: flex; align-items: stretch; height: 6.5in;
  }
  #wires { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
  .col {
    display: flex; flex-direction: column; justify-content: space-around;
    flex: 1; padding: 0 6px; position: relative; z-index: 1;
  }
  .col.center { flex: 1.3; justify-content: center; }

  /* ── Match box ── */
  .match {
    border: 1px solid #333; border-radius: 4px; padding: 2px 3px;
    background: #fff;
  }
  .m-date {
    font-size: 6.5px; color: #666; text-align: center;
    margin-bottom: 1px; letter-spacing: .2px;
  }
  .team { display: flex; align-items: center; gap: 3px; }
  .team + .team { margin-top: 1px; border-top: 1px dashed #ccc; padding-top: 1px; }
  .tname {
    flex: 1; font-size: 8.5px; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .tname.blank { border-bottom: 1px solid #aaa; height: 12px; }
  .goal {
    width: 15px; height: 14px; border: 1px solid #999; border-radius: 2px;
    flex-shrink: 0;
  }

  /* ── Final + champion ── */
  .col.center .match { border-width: 2px; border-color: #b8860b; }
  .col.center .m-date { font-size: 8px; color: #b8860b; font-weight: 700; }
  .col.center .tname { font-size: 10px; }
  .col.center .tname.blank { height: 16px; }
  .col.center .goal { width: 18px; height: 17px; }
  .center-bottom { position: absolute; bottom: 0; left: 0; right: 0; }
  .match.third { border-color: #cd7f32 !important; border-width: 1.5px !important; }
  .match.third .m-date { color: #cd7f32; font-weight: 700; font-size: 7px; }
  .match.third .tname { font-size: 8.5px; }
  .match.third .tname.blank { height: 13px; }
  .match.third .goal { width: 15px; height: 14px; }
  .champion { text-align: center; margin-top: 8px; }
  .champion .lbl {
    font-size: 9px; font-weight: 800; color: #b8860b; letter-spacing: 1.5px;
  }
  .champion .cbox {
    margin: 4px auto 0; border: 2px solid #b8860b; border-radius: 4px;
    height: 26px; width: 130px;
  }

  .legend {
    font-size: 8px; color: #666; margin-top: 4px; text-align: center;
  }
  .legend .lg-box {
    display: inline-block; width: 11px; height: 10px; border: 1px solid #999;
    border-radius: 2px; vertical-align: -1px; margin: 0 2px;
  }
</style>
</head>
<body>
<div class="page">
  <div class="header">
    <div>
      <div class="title">⚽ Quiniela Mundial 2026 · Fase Eliminatoria</div>
      <div class="subtitle">Escribí el ganador de cada partido en la ronda siguiente. Anotá los goles de cada equipo en su casilla.</div>
    </div>
    <div class="name-line">Nombre: <span class="blankline"></span></div>
  </div>

  <div class="round-labels">
    <div>16avos</div>
    <div>Octavos</div>
    <div>Cuartos</div>
    <div>Semis</div>
    <div class="final-lbl">Final</div>
    <div>Semis</div>
    <div>Cuartos</div>
    <div>Octavos</div>
    <div>16avos</div>
  </div>

  <div class="bracket">
    <svg id="wires" xmlns="http://www.w3.org/2000/svg"></svg>
    <div class="col" id="col-l-r32"></div>
    <div class="col" id="col-l-r16"></div>
    <div class="col" id="col-l-qf"></div>
    <div class="col" id="col-l-sf"></div>
    <div class="col center" id="col-final"></div>
    <div class="col" id="col-r-sf"></div>
    <div class="col" id="col-r-qf"></div>
    <div class="col" id="col-r-r16"></div>
    <div class="col" id="col-r-r32"></div>
  </div>

  <div class="legend">
    <span class="lg-box"></span> = casilla para los goles del equipo &nbsp;·&nbsp;
    Todas las horas en hora central (CST)
  </div>
</div>

<script>
// ── Data ──
const R32_LEFT = [
  {id:'l_1', a:'Sudáfrica',       b:'Canadá',      d:'Dom 28 Jun', t:'1:00 PM'},
  {id:'l_2', a:'Países Bajos',    b:'Marruecos',   d:'Lun 29 Jun', t:'7:00 PM'},
  {id:'l_3', a:'Alemania',        b:'Paraguay',    d:'Lun 29 Jun', t:'2:30 PM'},
  {id:'l_4', a:'Francia',         b:'Suecia',      d:'Mar 30 Jun', t:'3:00 PM'},
  {id:'l_5', a:'Bélgica',         b:'Senegal',     d:'Mié 1 Jul',  t:'2:00 PM'},
  {id:'l_6', a:'EE.UU.',          b:'Bosnia y H.', d:'Mié 1 Jul',  t:'6:00 PM'},
  {id:'l_7', a:'España',          b:'Austria',     d:'Jue 2 Jul',  t:'1:00 PM'},
  {id:'l_8', a:'Portugal',        b:'Croacia',     d:'Jue 2 Jul',  t:'5:00 PM'},
];
const R32_RIGHT = [
  {id:'r_1', a:'Brasil',          b:'Japón',       d:'Lun 29 Jun', t:'11:00 AM'},
  {id:'r_2', a:'Costa de Marfil', b:'Noruega',     d:'Mar 30 Jun', t:'11:00 AM'},
  {id:'r_3', a:'México',          b:'Ecuador',     d:'Mar 30 Jun', t:'7:00 PM'},
  {id:'r_4', a:'Inglaterra',      b:'RD Congo',    d:'Mié 1 Jul',  t:'10:00 AM'},
  {id:'r_5', a:'Suiza',           b:'Argelia',     d:'Jue 2 Jul',  t:'9:00 PM'},
  {id:'r_6', a:'Colombia',        b:'Ghana',       d:'Vie 3 Jul',  t:'7:30 PM'},
  {id:'r_7', a:'Australia',       b:'Egipto',      d:'Vie 3 Jul',  t:'12:00 PM'},
  {id:'r_8', a:'Argentina',       b:'Cabo Verde',  d:'Vie 3 Jul',  t:'4:00 PM'},
];
const LR16 = [
  {id:'lr16_1', d:'Sáb 4 Jul', t:'11:00 AM'},
  {id:'lr16_2', d:'Sáb 4 Jul', t:'3:00 PM'},
  {id:'lr16_3', d:'Lun 6 Jul', t:'6:00 PM'},
  {id:'lr16_4', d:'Lun 6 Jul', t:'1:00 PM'},
];
const RR16 = [
  {id:'rr16_1', d:'Dom 5 Jul', t:'2:00 PM'},
  {id:'rr16_2', d:'Dom 5 Jul', t:'6:00 PM'},
  {id:'rr16_3', d:'Mar 7 Jul', t:'2:00 PM'},
  {id:'rr16_4', d:'Mar 7 Jul', t:'10:00 AM'},
];
const LQF = [
  {id:'lqf_1', d:'Jue 9 Jul',  t:'2:00 PM'},
  {id:'lqf_2', d:'Vie 10 Jul', t:'1:00 PM'},
];
const RQF = [
  {id:'rqf_1', d:'Sáb 11 Jul', t:'3:00 PM'},
  {id:'rqf_2', d:'Sáb 11 Jul', t:'7:00 PM'},
];
const LSF = [{id:'lsf', d:'Mar 14 Jul', t:'1:00 PM'}];
const RSF = [{id:'rsf', d:'Mié 15 Jul', t:'1:00 PM'}];
const FINAL = {id:'final', d:'Dom 19 Jul', t:'1:00 PM'};

// ── Build ──
function teamRow(name){
  const blank = !name;
  return `<div class="team">
    <span class="tname ${blank?'blank':''}">${name||''}</span>
    <span class="goal"></span>
  </div>`;
}
function matchBox(m){
  return `<div class="match" id="m-${m.id}">
    <div class="m-date">${m.d} · ${m.t}</div>
    ${teamRow(m.a)}
    ${teamRow(m.b)}
  </div>`;
}
function fill(colId, list){
  document.getElementById(colId).innerHTML = list.map(matchBox).join('');
}

fill('col-l-r32', R32_LEFT);
fill('col-l-r16', LR16);
fill('col-l-qf',  LQF);
fill('col-l-sf',  LSF);
fill('col-r-sf',  RSF);
fill('col-r-qf',  RQF);
fill('col-r-r16', RR16);
fill('col-r-r32', R32_RIGHT);

document.getElementById('col-final').innerHTML =
  matchBox(FINAL) +
  `<div class="center-bottom">
     <div class="match third" id="m-third">
       <div class="m-date">🥉 3.ER LUGAR · Sáb 18 Jul · 8:00 PM</div>
       ${teamRow('')}
       ${teamRow('')}
     </div>
     <div class="champion">
       <div class="lbl">🏆 CAMPEÓN</div>
       <div class="cbox"></div>
     </div>
   </div>`;

// ── Connector wires ──
const FEEDS = [
  ['l_1','lr16_1','L'],['l_2','lr16_1','L'],
  ['l_3','lr16_2','L'],['l_4','lr16_2','L'],
  ['l_5','lr16_3','L'],['l_6','lr16_3','L'],
  ['l_7','lr16_4','L'],['l_8','lr16_4','L'],
  ['lr16_1','lqf_1','L'],['lr16_2','lqf_1','L'],
  ['lr16_3','lqf_2','L'],['lr16_4','lqf_2','L'],
  ['lqf_1','lsf','L'],['lqf_2','lsf','L'],
  ['lsf','final','L'],
  ['r_1','rr16_1','R'],['r_2','rr16_1','R'],
  ['r_3','rr16_2','R'],['r_4','rr16_2','R'],
  ['r_5','rr16_3','R'],['r_6','rr16_3','R'],
  ['r_7','rr16_4','R'],['r_8','rr16_4','R'],
  ['rr16_1','rqf_1','R'],['rr16_2','rqf_1','R'],
  ['rr16_3','rqf_2','R'],['rr16_4','rqf_2','R'],
  ['rqf_1','rsf','R'],['rqf_2','rsf','R'],
  ['rsf','final','R'],
];
function drawWires(){
  const bracket = document.querySelector('.bracket');
  const svg = document.getElementById('wires');
  const br = bracket.getBoundingClientRect();
  svg.setAttribute('width', br.width);
  svg.setAttribute('height', br.height);
  svg.setAttribute('viewBox', `0 0 ${br.width} ${br.height}`);
  svg.innerHTML = '';
  const rectOf = id => {
    const r = document.getElementById('m-'+id).getBoundingClientRect();
    return {
      left:   r.left  - br.left,
      right:  r.right - br.left,
      midY:  (r.top + r.bottom)/2 - br.top,
    };
  };
  FEEDS.forEach(([c,p,side])=>{
    const cr = rectOf(c), pr = rectOf(p);
    let x0, x2;
    if(side==='L'){ x0 = cr.right; x2 = pr.left; }
    else          { x0 = cr.left;  x2 = pr.right; }
    const xm = (x0 + x2)/2;
    const pts = `${x0},${cr.midY} ${xm},${cr.midY} ${xm},${pr.midY} ${x2},${pr.midY}`;
    const pl = document.createElementNS('http://www.w3.org/2000/svg','polyline');
    pl.setAttribute('points', pts);
    pl.setAttribute('fill', 'none');
    pl.setAttribute('stroke', '#999');
    pl.setAttribute('stroke-width', '1');
    svg.appendChild(pl);
  });
}
window.addEventListener('load', drawWires);
window.addEventListener('resize', drawWires);
window.addEventListener('beforeprint', drawWires);
</script>
</body>
</html>
