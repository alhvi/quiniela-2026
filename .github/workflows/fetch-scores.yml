name: Fetch WC2026 scores

on:
  # Corre cada 5 min durante julio; scripts/fetch-scores.mjs decide en cada
  # corrida (usando scripts/match-schedule.json) si hay un partido activo
  # en ese momento antes de gastar una llamada real al API.
  schedule:
    - cron: '*/5 * * 7 *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fetch-scores
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch scores from API
        env:
          WC2026_API_KEY: ${{ secrets.WC2026_API_KEY }}
        run: node scripts/fetch-scores.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/scores.json
          git diff --cached --quiet || git commit -m "chore: update scores $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
