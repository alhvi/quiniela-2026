name: Fetch WC2026 scores

on:
  # Corre cada 5 min durante julio; scripts/fetch-scores.mjs decide en cada
  # corrida (usando scripts/match-schedule.json) si hay un partido activo
  # en ese momento antes de gastar una llamada real al API.
  schedule:
    - cron: '*/5 * * 7 *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fetch-scores
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch scores from API
        env:
          WC2026_API_KEY: ${{ secrets.WC2026_API_KEY }}
        run: node scripts/fetch-scores.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/scores.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: update scores $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected, rebasing on origin/master and retrying (attempt $i)..."
            git fetch origin master
            git rebase origin/master
            sleep 3
          done
          echo "Failed to push after retries" >&2
          exit 1
